# Defaults target a developer running the app on the host against Dockerised
# datastores. The env-var overrides let the same profile run *inside* Compose,
# where the hosts are the service names rather than localhost.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bank}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

app:
  # Dev-only fallbacks so the app starts with no setup. Anything real comes from the
  # environment. These values must never be reused outside local development.
  jwt:
    secret: ${JWT_SECRET:G966Ckr+2LIimGPgFFQDljiZ8Y7yKrGafzmNY4d13bYCm3VI7y1skWKhulXXzKvh5bEkLKB3mP4+Z5/a6I8tOw==}

  admin:
    username: ${APP_ADMIN_USERNAME:admin@example.com}
    password: ${APP_ADMIN_PASSWORD:admin123@}

bank:
  customer-types:
    INDIVIDUAL:
      max-transaction-limit: 50000000
    BUSINESS:
      max-transaction-limit: 500000000

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    com.example.bankspringboot: DEBUG