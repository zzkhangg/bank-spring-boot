# Pin the Docker Engine API version used by Testcontainers/docker-java.
#
# Left unset, docker-java negotiates a version that modern Docker Desktop daemons
# (Engine 29+, minimum API 1.40) reject with HTTP 400. Testcontainers cannot decode
# that reply and reports the misleading "Could not find a valid Docker environment"
# even though Docker is running fine.
#
# This lives on the test classpath rather than in the Surefire config so that it
# applies to IDE test runs (IntelliJ launches JUnit directly and never goes through
# maven-surefire-plugin) as well as to `mvn test`.
#
# 1.41 clears the 1.40 floor while staying compatible back to Docker 20.10.
api.version=1.41
